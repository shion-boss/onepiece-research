[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "optcg_engine"
version = "0.1.0"
requires-python = ">=3.10"
description = "OPTCG rules engine (Rust, self-play high-speed mirror)"
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
features = ["pyo3/extension-module"]
