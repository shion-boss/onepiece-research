name: Audit System (Layer 1-4)

# 徹底改善 system の 自動 監査 (= docs/AUTO_AUDIT_SYSTEM.md)
# - push 毎: Layer 1 静的 lint (= 秒単位)
# - PR 毎  : Layer 2 軽量 runtime audit (= 数 分)
# - nightly : Layer 2 大規模 runtime audit (= 数 十 分)
# - weekly  : Layer 3 cardqa 再 tagging
# Layer 4 (= auto-fix) は dry-run report のみ (= human review queue 出力)。

on:
  push:
    branches: [main]
    paths:
      - 'db/cards.json'
      - 'db/card_effects.json'
      - 'engine/**'
      - 'scripts/audit_*.py'
      - 'scripts/lint_human_ui_contracts.py'
      - 'scripts/fuzz_human_play.py'
      - 'web/src/components/HumanMatchPlay.tsx'
      - 'tests/test_human_*.py'
      - 'tests/test_fuzz_*.py'
      - 'tests/test_human_path_conformance.py'
      - 'tests/test_cost_payment_oracle.py'
      - 'tests/test_effect_conformance.py'
      - 'tests/test_semantic_referee.py'
      - 'scripts/diff_human_vs_ai_path.py'
  pull_request:
    paths:
      - 'db/cards.json'
      - 'db/card_effects.json'
      - 'engine/**'
      - 'scripts/audit_*.py'
      - 'scripts/lint_human_ui_contracts.py'
      - 'scripts/fuzz_human_play.py'
      - 'web/src/components/HumanMatchPlay.tsx'
      - 'tests/test_human_*.py'
      - 'tests/test_fuzz_*.py'
      - 'tests/test_human_path_conformance.py'
      - 'tests/test_cost_payment_oracle.py'
      - 'tests/test_effect_conformance.py'
      - 'tests/test_semantic_referee.py'
      - 'scripts/diff_human_vs_ai_path.py'
  schedule:
    - cron: '0 18 * * *'  # nightly 03:00 JST
    - cron: '0 18 * * 0'  # weekly Sun 03:00 JST (= Phase 3)
  workflow_dispatch: {}

jobs:
  static-lint:
    name: Layer 1 静的 lint (= 秒単位)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Run static audit
        run: .venv/bin/python scripts/audit_overlay_static.py
      - name: Run primitive coverage lint (= overlay vs engine 整合)
        run: .venv/bin/python scripts/audit_primitive_coverage.py
      - name: Human-play UI 契約 lint (= dead component / payload キー不一致)
        run: .venv/bin/python scripts/lint_human_ui_contracts.py
      - name: Human-play 不変条件 ゲート (= fuzz カード保存則 + UI 契約 pytest)
        run: .venv/bin/python -m pytest tests/test_human_ui_contracts.py tests/test_fuzz_human_play_invariants.py -q
      - name: Human-path ルール適合 ゲート (= 召喚が効果の制約 filter/unique_name/no_effect/limit を守る)
        run: .venv/bin/python -m pytest tests/test_human_path_conformance.py -q
      - name: コスト支払い ゲート (= 効果発火したのにコスト未払い=踏み倒し が 0、 オラクル非空振りも検証)
        run: .venv/bin/python -m pytest tests/test_cost_payment_oracle.py -q
      - name: 効果意味ジャッジ ゲート (= 宣言した do を engine が実際に起こすか、 draw/mill 空振り 0)
        run: .venv/bin/python -m pytest tests/test_effect_conformance.py -q
      - name: 効果ランタイム・レフェリー ゲート (= 実対戦のカード保存則 + 複製/消失の非空振り証明)
        run: .venv/bin/python -m pytest tests/test_semantic_referee.py -q
      - name: Generate issue files
        run: .venv/bin/python scripts/audit_issue_generator.py --layer 1 --clear
      - name: Auto-fix L1 / L5 / L7 low-risk (= dry-run on PR、 commit on main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          .venv/bin/python scripts/audit_autofix_runner.py --risk low --no-pytest
          if [ -n "$(git status --porcelain db/card_effects.json)" ]; then
            git config user.name "audit-bot"
            git config user.email "audit-bot@noreply"
            git add db/card_effects.json db/auto_issues/
            git commit -m "auto: Layer 4 low-risk auto-fix (= audit_autofix_runner.py)"
            git push
          fi
      - name: Auto-fix dry-run (= PR)
        if: github.event_name == 'pull_request'
        run: .venv/bin/python scripts/audit_autofix_runner.py --risk low --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: static-audit-report
          path: |
            db/static_audit_report.json
            db/static_audit_report.md
            db/auto_issues/

  runtime-audit-light:
    name: Layer 2 runtime audit (= PR 用 軽量、 数 分)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Run runtime audit (10 games)
        env:
          ONEPIECE_AUDIT_INVARIANTS: '1'
        run: .venv/bin/python scripts/audit_runtime_invariants.py --n-games 10
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-audit-light
          path: |
            db/runtime_audit_report.json
            db/runtime_audit_report.md

  runtime-audit-nightly:
    name: Layer 2 nightly (= 全 16 deck、 数 十 分)
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 18 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Run runtime audit (100 games, default deck)
        env:
          ONEPIECE_AUDIT_INVARIANTS: '1'
        run: .venv/bin/python scripts/audit_runtime_invariants.py --n-games 100
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: runtime-audit-nightly
          path: |
            db/runtime_audit_report.json
            db/runtime_audit_report.md

  cardqa-retag:
    name: Layer 3 weekly cardqa re-tag
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 18 * * 0' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Re-tag cardqa
        run: .venv/bin/python scripts/audit_cardqa_tag.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain db/cardqa_tagged.json)" ]; then
            git config user.name "audit-bot"
            git config user.email "audit-bot@noreply"
            git add db/cardqa_tagged.json
            git commit -m "auto: Layer 3 weekly cardqa re-tag"
            git push
          fi
